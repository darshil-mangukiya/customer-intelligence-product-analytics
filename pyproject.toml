[project]
name = "customer-intelligence-platform"
version = "1.0.0"
description = "Production-style customer intelligence and product analytics platform for ecommerce analytics."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.1,<2.4",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.4,<1.8",
  "scipy>=1.12,<1.17",
  "statsmodels>=0.14,<0.15",
  "joblib>=1.3,<2.0",
  "matplotlib>=3.8,<3.11",
  "seaborn>=0.13,<0.14",
  "psycopg2-binary>=2.9,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "greenlet>=3.2,<4.0",
  "streamlit>=1.31,<2.0",
  "watchdog>=2.1.5,<7.0",
  "fastapi>=0.141.1,<0.142",
  "starlette>=1.3.1,<1.4",
  "uvicorn>=0.27,<0.36",
  "pydantic>=2.6,<3.0",
  "dbt-core>=1.11,<1.12",
  "dbt-postgres>=1.10,<1.11"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "ruff>=0.5,<0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
