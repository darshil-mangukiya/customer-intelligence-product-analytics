name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and Project Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBT_POSTGRES_PASSWORD: analytics
      DBT_POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg2://analytics:analytics@localhost:5432/analytics

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
          persist-credentials: false

      - name: Install system runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs r-base
          git lfs install --local

      - name: Hydrate Power BI LFS asset
        run: |
          git lfs pull --include="dashboards/powerbi/Customer_Intelligence_Product_Analytics.pbix" --exclude="" || {
            echo "::warning::Power BI PBIX LFS download failed; validating committed LFS pointer in CI."
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Generate deterministic CI outputs
        run: |
          make sample PYTHON=python
          make customer-intelligence PYTHON=python

      - name: Run Python and repository checks
        run: |
          python -m ruff check . --no-cache
          python -m scripts.ci_check
          python -m scripts.repository_check

      - name: Load and validate PostgreSQL warehouse
        run: |
          python -m warehouse_loader.postgres_loader
          python -m scripts.postgres_validate --database-url "$DATABASE_URL"

      - name: Run dbt lifecycle
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt debug --project-dir dbt --profiles-dir dbt
          dbt parse --project-dir dbt --profiles-dir dbt
          dbt compile --project-dir dbt --profiles-dir dbt
          dbt run --project-dir dbt --profiles-dir dbt
          dbt test --project-dir dbt --profiles-dir dbt
          dbt build --project-dir dbt --profiles-dir dbt

      - name: Run AI evaluations and UAT
        run: |
          python -m ai.evals.run_evals
          python -m business_analysis.run_uat

      - name: Validate Docker build
        run: |
          docker compose config --quiet
          docker compose build

      - name: Generate local supply-chain evidence
        run: |
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.1
          cyclonedx-py environment "$(command -v python)" --output-reproducible --output-format JSON --output-file /tmp/p3-ci-sbom.json
          set +e
          pip-audit -r requirements.lock --require-hashes --format=json --output=/tmp/p3-ci-dependency-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi

      - name: Check working-tree patch quality
        run: git diff --check
